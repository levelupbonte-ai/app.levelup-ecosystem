<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" fill="none">
  <defs>
    <linearGradient id="paint_levelup" x1="500" y1="10" x2="500" y2="90" gradientUnits="userSpaceOnUse">
      <stop stopColor="currentColor" stopOpacity="0.95"/>
      <stop offset="1" stopColor="currentColor" stopOpacity="0.80"/>
    </linearGradient>

    <linearGradient id="paint_ecosystem" x1="500" y1="95" x2="500" y2="205" gradientUnits="userSpaceOnUse">
      <stop stopColor="currentColor" stopOpacity="0.75"/>
      <stop offset="1" stopColor="currentColor" stopOpacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- LevelUp -->
  <text
    x="50%"
    y="85"
    text-anchor="middle"
    fill="url(#paint_levelup)"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DM Sans', sans-serif"
    font-size="100px"
    font-weight="900"
    letter-spacing="-0.01em"
  >
    LevelUp
  </text>

  <!-- Ecosystem -->
  <text
    x="50%"
    y="198"
    text-anchor="middle"
    fill="url(#paint_ecosystem)"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DM Sans', sans-serif"
    font-size="135px"
    font-weight="900"
    letter-spacing="0.01em"
  >
    Ecosystem
  </text>
</svg>
